# Common Features
USER_ID_FIELD: userID
ITEM_ID_FIELD: itemID
#RATING_FIELD: rating
TIME_FIELD: timestamp

filter_out_cod_start_users: True

inter_file_name: 'tiktok.inter'

# name of features
vision_feature_file: 'image_feat.npy'
text_feature_file: 'text_feat.npy'
audio_feature_file: 'audio_feat.npy'
user_graph_dict_file: 'user_graph_dict.npy'
item_graph_dict_file: 'item_graph_dict.npy'

field_separator: "\t"

# TikTok-tree training/evaluation defaults (historically set in the separate
# src_tiktok/configs/overall.yaml). Kept here so the unified tree reproduces
# the tiktok runs exactly. Model yaml / best-json values still override these.
stopping_step: 20
train_batch_size: 4096
eval_step: 1
metrics: ["Recall", "NDCG", "Precision", "MAP"]
topk: [5, 10, 20, 50]
missing_ratio: 0.6
